context:
  version: "26.3.0dev"

package:
  name: freecad
  version: "${{ version }}"

source:
  git: https://github.com/FreeCAD/FreeCAD.git
  rev: main

build:
  number: 0
  script: bash package/bundle/build.sh

requirements:
  build:
    - ccache
    - cmake
    - compilers >=1.10,<1.11
    - doxygen
    - git
    - gtest
    - ninja
    - noqt5
    - python >=3.11,<3.12
    - qt6-main >=6.8,<6.9
    - swig

    - if: linux and x86_64
      then:
        - clang
        - clangxx
        - compiler-rt >=18.1.8,<22
        - kernel-headers_linux-64
        - libdrm-cos7-x86_64
        - libopengl-devel
        - libselinux-cos7-x86_64
        - libsepol-cos7-x86_64
        - libspnav
        - libx11-common-cos7-x86_64
        - libx11-cos7-x86_64
        - libxau-cos7-x86_64
        - libxcb-cos7-x86_64
        - libxdamage-cos7-x86_64
        - libxext-cos7-x86_64
        - libxfixes-cos7-x86_64
        - libxi-cos7-x86_64
        - libxi-devel-cos7-x86_64
        - libxxf86vm-cos7-x86_64
        - mesa-dri-drivers-cos7-x86_64
        - mesa-libegl-cos7-x86_64
        - mesa-libegl-devel-cos7-x86_64
        - mesa-libgl-cos7-x86_64
        - mesa-libgl-devel-cos7-x86_64
        - mesa-libglu-devel-conda-x86_64
        - mold
        - pixman-cos7-x86_64
        - sed
        - sysroot_linux-64
        - xcb-util-cursor ==0.1.5
        - xorg-x11-server-common-cos7-x86_64
        - xorg-x11-server-xvfb-cos7-x86_64
        - xorg-xproto

    - if: linux and aarch64
      then:
        - clang
        - clangxx
        - compiler-rt >=18.1.8,<22
        - kernel-headers_linux-aarch64
        - libdrm-cos7-aarch64
        - libglvnd-cos7-aarch64
        - libglvnd-glx-cos7-aarch64
        - libopengl-devel
        - libselinux-cos7-aarch64
        - libsepol-cos7-aarch64
        - libspnav
        - libx11-common-cos7-aarch64
        - libx11-cos7-aarch64
        - libxau-cos7-aarch64
        - libxcb-cos7-aarch64
        - libxdamage-cos7-aarch64
        - libxext-cos7-aarch64
        - libxfixes-cos7-aarch64
        - libxi-cos7-aarch64
        - libxi-devel-cos7-aarch64
        - libxxf86vm-cos7-aarch64
        - mesa-dri-drivers-cos7-aarch64
        - mesa-khr-devel-cos7-aarch64
        - mesa-libegl-cos7-aarch64
        - mesa-libegl-devel-cos7-aarch64
        - mesa-libgbm-cos7-aarch64
        - mesa-libgl-cos7-aarch64
        - mesa-libgl-devel-cos7-aarch64
        - mesa-libglapi-cos7-aarch64
        - mold
        - pixman-cos7-aarch64
        - sed
        - sysroot_linux-aarch64
        - xcb-util-cursor ==0.1.5
        - xorg-x11-server-common-cos7-aarch64
        - xorg-x11-server-xvfb-cos7-aarch64
        - xorg-xproto

    - if: osx and x86_64
      then:
        - __osx >=10.13

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - cpptrace
    - eigen >=3.3,<5
    - expat
    - fmt
    - freetype
    - harfbuzz
    - hdf5
    - lark
    - libboost-devel
    - matplotlib
    - nlohmann_json
    - noqt5
    - numpy >=1.26,<1.27
    - occt >=7.8,<7.9
    - openssl
    - pcl
    - ply
    - pybind11
    - pyside6
    - python >=3.11,<3.12
    - qt6-main >=6.8,<6.9
    - six
    - smesh
    - tbb-devel >=2022,<2023
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib
    - zstd

    - if: win
      then:
        - pthreads-win32

    - if: unix
      then:
        - sed

    - if: linux
      then:
        - libspnav
        - xorg-xproto

  run:
    - av
    - blas * openblas*
    - blinker
    - calculix
    - debugpy
    - defusedxml
    - docutils
    - gmsh >=4.13.1,<5
    - graphviz
    - ifcopenshell
    - lark
    - llvm-openmp
    - lxml
    - matplotlib
    - nine
    - noqt5
    - numpy >=1.26,<1.27
    - occt >=7.8,<7.9
    - opencamlib
    - pandas
    - pip
    - ply
    - pycollada
    - pyside6
    - python >=3.11,<3.12
    - pythonocc-core
    - pyyaml
    - qt6-main >=6.8,<6.9
    - requests
    - scipy
    - sympy
    - typing-extensions
    - vtk
    - xlutils

    - if: linux
      then:
        - libspnav
        - qt6-wayland >=6.8,<6.9
        - xcb-util-cursor ==0.1.5
