context:
  version: "26.3.0dev"

package:
  name: freecad
  version: "${{ version }}"

source:
  git: https://github.com/FreeCAD/FreeCAD.git
  rev: main

build:
  number: 0
  script:
    - if: unix
      then: |
        for flags_var in CFLAGS CXXFLAGS DEBUG_CFLAGS DEBUG_CXXFLAGS; do
            if [[ -n "${!flags_var:-}" ]]; then
                export "${flags_var}=${!flags_var//-fno-merge-constants/}"
            fi
        done
        unset CMAKE_GENERATOR
        unset CMAKE_GENERATOR_PLATFORM
        cmake \
          ${CMAKE_ARGS} \
          ${CMAKE_PLATFORM_FLAGS[@]} \
          --preset conda-linux-release \
          -D CMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local/homebrew" \
          -D CMAKE_INCLUDE_PATH:FILEPATH="${PREFIX}/include" \
          -D CMAKE_INSTALL_LIBDIR:FILEPATH="${PREFIX}/lib" \
          -D CMAKE_INSTALL_PREFIX:FILEPATH="${PREFIX}" \
          -D CMAKE_LIBRARY_PATH:FILEPATH="${PREFIX}/lib" \
          -D CMAKE_PREFIX_PATH:FILEPATH="${PREFIX}" \
          -D RELATIVE_RPATH=ON \
          -D INSTALL_TO_SITEPACKAGES:BOOL=ON \
          -D OCC_INCLUDE_DIR:FILEPATH="${PREFIX}/include/opencascade" \
          -D OCC_LIBRARY_DIR:FILEPATH="${PREFIX}/lib" \
          -D Python_EXECUTABLE:FILEPATH="$PYTHON" \
          -D Python3_EXECUTABLE:FILEPATH="$PYTHON" \
          -D BUILD_DYNAMIC_LINK_PYTHON:BOOL=OFF \
          -B build \
          -S .
    
    - if: win
      then: |
        set "CMAKE_GENERATOR="
        set "CMAKE_GENERATOR_PLATFORM="
        cmake ^
          %CMAKE_ARGS% ^
          --preset conda-windows-release ^
          -D CMAKE_C_COMPILER:STRING="%CC%" ^
          -D CMAKE_CXX_COMPILER:STRING="%CXX%" ^
          -D CMAKE_INCLUDE_PATH:FILEPATH="%LIBRARY_PREFIX%/include" ^
          -D CMAKE_INSTALL_LIBDIR:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D CMAKE_INSTALL_PREFIX:FILEPATH="%LIBRARY_PREFIX%" ^
          -D CMAKE_LIBRARY_PATH:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D CMAKE_PREFIX_PATH:FILEPATH="%LIBRARY_PREFIX%" ^
          -D RELATIVE_RPATH=ON ^
          -D INSTALL_TO_SITEPACKAGES:BOOL=ON ^
          -D OCC_INCLUDE_DIR:FILEPATH="%LIBRARY_PREFIX%/include/opencascade" ^
          -D OCC_LIBRARY_DIR:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D Python_EXECUTABLE:FILEPATH="%PYTHON%" ^
          -D Python3_EXECUTABLE:FILEPATH="%PYTHON%" ^
          -D SMESH_INCLUDE_DIR:FILEPATH="%LIBRARY_PREFIX%/include/smesh" ^
          -D SMESH_LIBRARY:FILEPATH="%LIBRARY_PREFIX%/lib/SMESH.lib" ^
          -B build ^
          -S .

    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ccache
    - cmake
    - compilers>=1.10,<1.11
    - doxygen
    - gtest
    - ninja
    - noqt5
    - python>=3.11,<3.12
    - qt6-main>=6.8,<6.9
    - swig>=4.3,<4.4

    - if: linux and x86_64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-64
        - libdrm-cos7-x86_64
        - libselinux-cos7-x86_64
        - libsepol-cos7-x86_64
        - libspnav
        - libx11-common-cos7-x86_64
        - libx11-cos7-x86_64
        - libxau-cos7-x86_64
        - libxcb-cos7-x86_64
        - libxdamage-cos7-x86_64
        - libxext-cos7-x86_64
        - libxfixes-cos7-x86_64
        - libxi-cos7-x86_64
        - libxi-devel-cos7-x86_64
        - libxxf86vm-cos7-x86_64
        - mesa-dri-drivers-cos7-x86_64
        - mesa-libegl-cos7-x86_64
        - mesa-libegl-devel-cos7-x86_64
        - mesa-libgl-cos7-x86_64
        - mesa-libgl-devel-cos7-x86_64
        - mold
        - pixman-cos7-x86_64
        - sed
        - sysroot_linux-64
        - xcb-util-cursor==0.1.5  ## hack to address https://github.com/FreeCAD/FreeCAD/issues/26726
        - xorg-x11-server-common-cos7-x86_64
        - xorg-x11-server-xvfb-cos7-x86_64
        - xorg-xproto

    - if: linux and aarch64
      then:
        - clang
        - clangxx
        - kernel-headers_linux-aarch64
        - libdrm-cos7-aarch64
        - libselinux-cos7-aarch64
        - libsepol-cos7-aarch64
        - libspnav
        - libx11-common-cos7-aarch64
        - libx11-cos7-aarch64
        - libxau-cos7-aarch64
        - libxcb-cos7-aarch64
        - libxdamage-cos7-aarch64
        - libxext-cos7-aarch64
        - libxfixes-cos7-aarch64
        - libxi-cos7-aarch64
        - libxi-devel-cos7-aarch64
        - libxxf86vm-cos7-aarch64
        - mesa-dri-drivers-cos7-aarch64
        - mesa-libegl-cos7-aarch64
        - mesa-libegl-devel-cos7-aarch64
        - mesa-libgl-cos7-aarch64
        - mesa-libgl-devel-cos7-aarch64
        - mold
        - pixman-cos7-aarch64
        - sed
        - sysroot_linux-aarch64
        - xcb-util-cursor==0.1.5  ## hack to address https://github.com/FreeCAD/FreeCAD/issues/26726
        - xorg-x11-server-common-cos7-aarch64
        - xorg-x11-server-xvfb-cos7-aarch64
        - xorg-xproto

    - if: osx and x86_64
      then:
        - __osx >=10.13

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - eigen >=3.3,<5
    - fmt
    - expat
    - freetype
    - hdf5
    - lark
    - libboost-devel
    - matplotlib-base
    - noqt5
    - numpy>=1.26,<2
    - occt>=7.8,<7.9
    - pcl
    - ply
    - pybind11
    - pyside6
    - python>=3.11,<3.12
    - qt6-main>=6.8,<6.9
    - six
    - smesh
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib

    - if: win
      then:
        - winpthreads-devel
        - tbb-devel

    - if: unix
      then:
        - sed

    - if: linux
      then:
        - libspnav
        - xorg-xproto

  run:
    - av
    - blas * openblas*
    - blinker
    - calculix
    - debugpy
    - defusedxml
    - docutils
    - gmsh
    - graphviz
    - ifcopenshell
    - lark
    - lxml
    - matplotlib-base
    - nine
    - noqt5
    - numpy>=1.26,<2
    - occt>=7.8,<7.9
    - olefile
    - opencamlib
    - pandas
    - pip
    - ply
    - pycollada
    - pyside6
    - python>=3.11,<3.12
    - pythonocc-core
    - pyyaml
    - qt6-main>=6.8,<6.9
    - requests
    - scipy
    - sympy
    - typing_extensions
    - vtk
    - xlutils

    - if: linux
      then:
        - libspnav
        - qt6-wayland
        - xcb-util-cursor==0.1.5  ## hack to address https://github.com/FreeCAD/FreeCAD/issues/26726
