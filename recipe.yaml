context:
  version: "26.3.0dev"

package:
  name: freecad
  version: "${{ version }}"

source:
  git: https://github.com/FreeCAD/FreeCAD.git
  rev: main

build:
  number: 0
  script:
    - if: unix
      then: |
        unset CMAKE_GENERATOR
        unset CMAKE_GENERATOR_PLATFORM
        cmake \
          ${CMAKE_ARGS} \
          ${CMAKE_PLATFORM_FLAGS[@]} \
          --preset conda-linux-release \
          -D CMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local/homebrew" \
          -D CMAKE_INCLUDE_PATH:FILEPATH="${PREFIX}/include" \
          -D CMAKE_INSTALL_LIBDIR:FILEPATH="${PREFIX}/lib" \
          -D CMAKE_INSTALL_PREFIX:FILEPATH="${PREFIX}" \
          -D CMAKE_LIBRARY_PATH:FILEPATH="${PREFIX}/lib" \
          -D CMAKE_PREFIX_PATH:FILEPATH="${PREFIX}" \
          -D RELATIVE_RPATH=ON \
          -D INSTALL_TO_SITEPACKAGES:BOOL=ON \
          -D OCC_INCLUDE_DIR:FILEPATH="${PREFIX}/include/opencascade" \
          -D OCC_LIBRARY_DIR:FILEPATH="${PREFIX}/lib" \
          -D Python_EXECUTABLE:FILEPATH="$PYTHON" \
          -D Python3_EXECUTABLE:FILEPATH="$PYTHON" \
          -D BUILD_DYNAMIC_LINK_PYTHON:BOOL=OFF \
          -B build \
          -S .
    
    - if: win
      then: |
        set "CMAKE_GENERATOR="
        set "CMAKE_GENERATOR_PLATFORM="
        cmake ^
          %CMAKE_ARGS% ^
          --preset conda-windows-release ^
          -D CMAKE_C_COMPILER:STRING="%CC%" ^
          -D CMAKE_CXX_COMPILER:STRING="%CXX%" ^
          -D CMAKE_INCLUDE_PATH:FILEPATH="%LIBRARY_PREFIX%/include" ^
          -D CMAKE_INSTALL_LIBDIR:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D CMAKE_INSTALL_PREFIX:FILEPATH="%LIBRARY_PREFIX%" ^
          -D CMAKE_LIBRARY_PATH:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D CMAKE_PREFIX_PATH:FILEPATH="%LIBRARY_PREFIX%" ^
          -D RELATIVE_RPATH=ON ^
          -D INSTALL_TO_SITEPACKAGES:BOOL=ON ^
          -D OCC_INCLUDE_DIR:FILEPATH="%LIBRARY_PREFIX%/include/opencascade" ^
          -D OCC_LIBRARY_DIR:FILEPATH="%LIBRARY_PREFIX%/lib" ^
          -D Python_EXECUTABLE:FILEPATH="%PYTHON%" ^
          -D Python3_EXECUTABLE:FILEPATH="%PYTHON%" ^
          -D SMESH_INCLUDE_DIR:FILEPATH="%LIBRARY_PREFIX%/include/smesh" ^
          -D SMESH_LIBRARY:FILEPATH="%LIBRARY_PREFIX%/lib/SMESH.lib" ^
          -B build ^
          -S .

    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ccache
    - cmake
    - compilers >=1.10,<1.11
    - doxygen
    - git
    - gtest
    - ninja
    - noqt5
    - python >=3.11,<3.12
    - qt6-main >=6.8,<6.9
    - swig
    - if: unix
      then:
        - sed

    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}

  host:
    - cpptrace
    - eigen >=3.3,<5
    - expat
    - fmt
    - freetype
    - harfbuzz
    - hdf5
    - lark
    - libboost-devel
    - matplotlib
    - nlohmann_json
    - noqt5
    - numpy >=1.26,<1.27
    - occt >=7.8,<7.9
    - openssl
    - pcl
    - ply
    - pybind11
    - pyside6
    - python >=3.11,<3.12
    - qt6-main >=6.8,<6.9
    - six
    - smesh
    - if: win
      then:
        - tbb-devel >=2022,<2023
    - vtk
    - xerces-c
    - yaml-cpp
    - zlib
    - zstd
    - if: linux
      then:
        - libspnav
        - xorg-xproto
        - libgl-devel
        - libegl-devel
        - xorg-libxi

  run:
    - graphviz
    - gmsh
    - if: linux
      then:
        - libspnav
    - numpy >=1.26,<1.27
    - python >=3.11,<3.12
    - occt >=7.8,<7.9
    - vtk
    - pyside6
    - pyyaml
    - ply
    - six
    - smesh
